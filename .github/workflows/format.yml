name: formatting

on:
  pull_request:
    branches:
      - main
      - develop
      - master
      - workos
  push:
    branches:
      - main
      - develop
      - master
      - workos

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check
