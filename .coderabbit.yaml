# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: >-
  Act like a thoughtful, pragmatic senior engineer doing a real peer code review.
  Keep feedback concise, constructive, and direct without robotic boilerplate, filler,
  or pedantic nitpicks. Focus strictly on critical bugs, data loss, logic defects,
  security vulnerabilities, or noticeable performance issues. Skip generic advice
  and avoid summarizing obvious code changes.

early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true
  path_filters:
    - "!vendor/**"
    - "!node_modules/**"
    - "!public/**"
    - "!storage/**"
    - "!bootstrap/cache/**"
    - "!composer.lock"
    - "!package-lock.json"
  auto_review:
    enabled: true
    drafts: false
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    biome:
      enabled: false
    rubocop:
      enabled: false
