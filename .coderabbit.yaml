# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

tone_instructions: >-
  Be concise, direct, and practical like a human maintainer. Focus on real bugs,
  security, regressions, and correctness. Avoid nitpicking formatting or style.
  Provide clear fixes and prefer high-signal feedback over filler.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
